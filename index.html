<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resuelvemates · Restas</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#1c2a4a;--mut:#5b6b8c;--bar:#2f6fed;--x:#e8590c;--new:#12a07a;--line:#c9d6ea;--acc:#ffd43b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--card:#18234a;--ink:#eef2ff;--mut:#9fb0d6;--bar:#6d9bff;--x:#ff9a5c;--new:#3ddc9f;--line:#2c3a6b}}
:root[data-theme="dark"]{--bg:#0f1730;--card:#18234a;--ink:#eef2ff;--mut:#9fb0d6;--bar:#6d9bff;--x:#ff9a5c;--new:#3ddc9f;--line:#2c3a6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;line-height:1.35}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0;font-size:2.2rem}.sub{margin:0 0 16px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;background:var(--bar);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.tab{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button.tab[aria-selected="true"]{background:var(--acc);color:#1c2a4a;border-color:var(--acc)}
button.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
input{font:inherit;font-size:1.6rem;width:4.2em;text-align:center;border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--bg);color:var(--ink)}
.op{font-size:2rem;font-weight:700}
.err{color:var(--x);min-height:1.4em;margin:8px 0 0}
.stage{display:flex;flex-wrap:wrap;gap:24px;margin-top:18px;align-items:flex-start}
.g{display:grid;grid-template-columns:1.2em 5.6rem 5.6rem;font-size:2.4rem;font-weight:700;text-align:center;align-items:end}
.g .h{font-size:.95rem;font-weight:500;color:var(--mut)}
.g i{grid-column:1/-1;border-top:3px solid var(--ink);margin:4px 0}
.g .fin{background:var(--acc);color:#1c2a4a;border-radius:10px}
.blocks{flex:1;min-width:220px}
.lbl{margin:0 0 4px;color:var(--mut);font-size:.95rem}
.bars,.xs{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:76px;margin-bottom:12px}
.bar{position:relative;width:16px;height:70px;border-radius:5px;background:var(--bar)}
.x{position:relative;width:1.2em;text-align:center;font-weight:700;font-size:1.9rem;color:var(--x)}
.x.new{color:var(--new)}.x.pop{animation:pop .5s}
.out{opacity:.45}
.out::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:3px solid var(--ink);transform:rotate(-20deg)}
.bar.removed{background:transparent;outline:2px dashed var(--line);opacity:.8}
.bar.removed::after{display:none}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.x.pop{animation:none}}
.ttl{margin:14px 0 2px;font-size:1.3rem}.msg{margin:0 0 12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cnt{color:var(--mut)}
.q{font-size:2.4rem;font-weight:700;margin:0 0 10px}
.fb{margin:10px 0 0;font-weight:700}.fb.ok{color:var(--new)}.fb.ko{color:var(--x)}
[hidden]{display:none!important}
</style></head><body><main>
<h1>Resuelvemates</h1>
<p class="sub">Resta paso a paso con bloques</p>
<div class="tabs" role="tablist">
<button class="tab" id="t1" role="tab" aria-selected="true">👀 Ver solución</button>
<button class="tab" id="t2" role="tab" aria-selected="false">✍ Practicar</button>
</div>

<section id="s1" class="card">
<div class="row">
<input id="a" type="number" inputmode="numeric" min="0" max="99" aria-label="Minuendo" placeholder="74">
<span class="op">−</span>
<input id="b" type="number" inputmode="numeric" min="0" max="99" aria-label="Sustraendo" placeholder="38">
<button id="go">Ver paso a paso</button>
</div>
<p class="err" id="err" role="alert"></p>
<div id="out"></div>
</section>

<section id="s2" class="card" hidden>
<p class="q" id="pq"></p>
<div class="row">
<input id="ans" type="number" inputmode="numeric" aria-label="Tu respuesta" placeholder="?">
<button id="chk">Comprobar</button>
<button class="ghost" id="see">Ver paso a paso</button>
<button class="ghost" id="nw">Nueva resta</button>
</div>
<p class="fb" id="fb" role="status"></p>
<div id="out2"></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const pl=(n,a,b)=>n+' '+(n==1?a:b);
const c=(t,k='')=>`<span class="${k}">${t}</span>`;

function mount(el,M,S){
  const mt=M/10|0,mu=M%10,st=S/10|0,su=S%10,carry=su>mu,r=M-S;
  const rt=mt-st-(carry?1:0),ru=mu+(carry?10:0)-su;
  const ph=carry?['rep','carry','cross','rem','res']:['rep','cross','rem','res'];
  const T={rep:'Representamos el minuendo',carry:'Necesitamos una llevada',cross:'Tachamos barras y X',rem:'Escribimos lo que nos queda',res:'Resultado'};
  const msg={
    rep:`El minuendo es ${M}: ${pl(mt,'barra','barras')} (decenas) y ${mu} X (unidades).`,
    carry:'No tenemos suficientes X para tachar las unidades, quitamos una Barra para poder generar 10 X más.',
    cross:`Tachamos ${pl(st,'barra','barras')} y ${su} X: son las del sustraendo ${S}.`,
    rem:`Nos quedan ${pl(rt,'barra','barras')} y ${ru} X. Las barras las ponemos debajo de las decenas (${rt}) y en las unidades ponemos 0. Las X las ponemos debajo de las unidades (${ru}) y en las decenas ponemos 0. Después los sumamos.`,
    res:`El resultado de ${M} − ${S} es ${r}.`};
  let i=0;
  el.innerHTML=`<div class="stage"><div class="g"></div><div class="blocks"><p class="lbl">Decenas (barras)</p><div class="bars"></div><p class="lbl">Unidades (X)</p><div class="xs"></div></div></div><h3 class="ttl"></h3><p class="msg"></p><div class="nav"><button class="ghost" data-d="-1">Anterior</button><span class="cnt"></span><button data-d="1">Siguiente</button></div>`;
  const q=s=>el.querySelector(s);
  function draw(){
    const p=ph[i],crossed=p=='cross'||p=='rem'||p=='res',moved=carry&&p!='rep';
    let h=c('')+c('decenas','h')+c('unidades','h')+c('')+c(mt||'')+c(mu)+c('−')+c(st||'')+c(su)+'<i></i>';
    if(p=='rem'||p=='res') h+=c('')+c(rt)+c(0)+c('+')+c(0)+c(ru)+'<i></i>';
    if(p=='res') h+=c('')+c(r>=10?rt:'',r>=10?'fin':'')+c(r%10,'fin');
    q('.g').innerHTML=h;
    let b='';
    for(let k=0;k<mt;k++) b+=`<span class="bar${moved&&k==mt-1?' removed':crossed&&k<st?' out':''}"></span>`;
    q('.bars').innerHTML=b;
    let x='';
    for(let k=0;k<mu+(moved?10:0);k++) x+=`<span class="x${k>=mu?' new':''}${k>=mu&&p=='carry'?' pop':''}${crossed&&k<su?' out':''}">X</span>`;
    q('.xs').innerHTML=x;
    q('.ttl').textContent=`Paso ${i+1} · ${T[p]}`;
    q('.msg').textContent=msg[p];
    q('.cnt').textContent=`Paso ${i+1} de ${ph.length}`;
    el.querySelector('[data-d="-1"]').disabled=i==0;
    el.querySelector('[data-d="1"]').disabled=i==ph.length-1;
  }
  el.onclick=e=>{const d=e.target.dataset.d;if(d){i=Math.min(ph.length-1,Math.max(0,i+ +d));draw()}};
  draw();
}

/* Ver solución */
function go(){
  const va=$('#a').value,vb=$('#b').value,M=+va,S=+vb,e=$('#err');
  if(va===''||vb===''||!Number.isInteger(M)||!Number.isInteger(S)||M<0||M>99||S<0||S>M){
    e.textContent='Escribe dos números enteros del 0 al 99, con el primero mayor o igual que el segundo.';
    $('#out').innerHTML='';return;
  }
  e.textContent='';mount($('#out'),M,S);
}
$('#go').onclick=go;
['a','b'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key=='Enter')go()}));

/* Practicar */
let P;
function nueva(){
  const M=10+Math.floor(Math.random()*90);
  P=[M,1+Math.floor(Math.random()*(M-1))];
  $('#pq').textContent=`${P[0]} − ${P[1]} = ?`;
  $('#ans').value='';$('#fb').textContent='';$('#fb').className='fb';$('#out2').innerHTML='';
}
$('#nw').onclick=nueva;
$('#see').onclick=()=>mount($('#out2'),P[0],P[1]);
$('#chk').onclick=()=>{
  const v=$('#ans').value,f=$('#fb');
  if(v===''){f.className='fb ko';f.textContent='Escribe tu respuesta primero.';return}
  if(+v==P[0]-P[1]){f.className='fb ok';f.textContent='¡Muy bien!'}
  else{f.className='fb ko';f.textContent='Casi. Mira cómo se resuelve:';mount($('#out2'),P[0],P[1])}
};
$('#ans').addEventListener('keydown',e=>{if(e.key=='Enter')$('#chk').click()});

/* Pestañas */
function tab(n){
  $('#s1').hidden=n!=1;$('#s2').hidden=n!=2;
  $('#t1').setAttribute('aria-selected',n==1);$('#t2').setAttribute('aria-selected',n==2);
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
nueva();
</script></body></html>
